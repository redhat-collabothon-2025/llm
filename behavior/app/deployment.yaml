apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-analyzer-app
  namespace: white-hat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-analyzer
  template:
    metadata:
      labels:
        app: security-analyzer
    spec:
      containers:
        - name: app
          image: quay.io/your-org/security-analyzer:latest
          ports:
            - containerPort: 8501
          env:
            - name: VLLM_ENDPOINT
              value: "http://granite-security-analyzer-predictor:8080/v1/completions"
---
apiVersion: v1
kind: Service
metadata:
  name: security-analyzer-app
  namespace: white-hat
spec:
  selector:
    app: security-analyzer
  ports:
    - port: 8501
      targetPort: 8501
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: security-analyzer
  namespace: white-hat
spec:
  to:
    kind: Service
    name: security-analyzer-app
  port:
    targetPort: 8501
  tls:
