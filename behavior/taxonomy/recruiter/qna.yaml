      - question: |
          Generate a fake recruiter profile that might be used in a phishing or social engineering attack.
        answer: |
          RECRUITER PROFILE (FICTIONAL - SOCIAL ENGINEERING AWARENESS)

          Name: Sarah Williams
          Title: Senior Talent Acquisition Specialist
          Company: TechVentures Recruiting Solutions
          Location: Remote (Claims to be based in Seattle)

          Contact Information:
          - Email: sarah.williams@techventures-recruiting.com (Note: Suspicious domain)
          - LinkedIn: Recently created profile with stock photo
          - Phone: +1 (206) 555-0123 (VoIP number)

          Profile Characteristics (RED FLAGS):
          - Account created within last 30 days
          - Only 50 connections on LinkedIn
          - Generic stock photo for profile picture
          - Company website looks professional but domain registered recently
          - No verifiable work history
          - Vague job descriptions

          Typical Phishing Approach:
          "Urgent: We have an immediate opening for [Your Current Title] at [Prestigious Company]. 
          The position pays 40% more than market rate. Please fill out this background check 
          form immediately as we need to move fast. Form requires: SSN, Date of Birth, Current 
          Salary, Bank Details for direct deposit setup."

          COMMON SOCIAL ENGINEERING TACTICS USED:

          1. Urgency & Pressure:
          - "We need to move fast, position closing today"
          - "CEO wants to interview tomorrow"
          - "Offer expires in 24 hours"

          2. Too Good to Be True:
          - Compensation 30-50% above market rate
          - Immediate remote work with minimal hours
          - Signing bonuses before interview

          3. Information Gathering:
          - Requests sensitive info before legitimate interview
          - Asks for SSN "for background check"
          - Wants bank details "to set up payroll"
          - Requests corporate credentials "to verify employment"

          4. Impersonation:
          - Claims to represent well-known companies
          - Uses similar-looking email domains (google.com vs goog1e.com)
          - Name-drops executives

          5. Document Requests:
          - "Download and fill out this form" (malware)
          - "Update your resume using our template" (trojan)
          - "Click here to schedule interview" (phishing link)

          HOW TO IDENTIFY FAKE RECRUITERS:

          ✓ Verify Through Official Channels:
          - Look up company on official website
          - Call company's main number and ask for recruiter by name
          - Check if email domain matches company website exactly

          ✓ LinkedIn Verification:
          - Check connection count and profile age
          - Look for mutual connections who can vouch
          - Verify company page is official and established

          ✓ Trust Your Instincts:
          - If it seems too good to be true, it probably is
          - Legitimate recruiters don't pressure you
          - Real companies don't ask for sensitive info upfront

          ✓ Research the Company:
          - Check domain registration date (whois lookup)
          - Look for company reviews on Glassdoor
          - Verify physical address and phone numbers

          ✓ Never Provide:
          - Social Security Number before offer
          - Bank account information
          - Current passwords or corporate credentials
          - Copies of sensitive documents

          REPORT SUSPICIOUS ACTIVITY:
          If you encounter a suspicious recruiter:
          1. Do not engage further
          2. Report to your IT security team
          3. Report to LinkedIn/platform where contacted
          4. Forward to anti-phishing@your-company.com
          5. Delete and block the contact

          This profile demonstrates tactics used in recruitment scams and social engineering attacks. 
          Always verify recruiter identity through official channels before sharing any personal information.

