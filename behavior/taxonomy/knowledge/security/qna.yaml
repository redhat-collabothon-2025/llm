      - question: |
          Analyze employee behavior for emp_003:

          Activity Summary:
          - After-hours login at 23:45 from external IP 85.232.45.100
          - Downloaded company_confidential_strategy.pdf at 23:48
          - Using curl/7.68.0 user agent (automated tool)
          - Location: Unknown
          - Very short session (3 minutes)

          Assess security risk.
        answer: |
          SECURITY ASSESSMENT - CRITICAL SECURITY INCIDENT

          Employee ID: emp_003
          Risk Level: CRITICAL

          IMMEDIATE THREAT DETECTED:
          This activity represents an active security incident requiring immediate response.

          CRITICAL INDICATORS:
          • After-hours access (23:45) - red flag
          • External IP address (85.232.45.100) - MAJOR red flag
          • Automated tool usage (curl/7.68.0) - indicates scripted attack
          • Confidential document access
          • Very brief session (3 minutes) - suggests targeted exfiltration
          • Unknown location

          THREAT ASSESSMENT:
          This pattern is consistent with:
          - Active data exfiltration in progress
          - Compromised credentials being used by threat actor
          - Automated data theft operation
          - Potential APT (Advanced Persistent Threat) activity

          IMMEDIATE ACTIONS REQUIRED:
          1. CRITICAL: Suspend emp_003 account immediately
          2. Block IP address 85.232.45.100 at firewall
          3. Initiate incident response protocol
          4. Preserve all logs and system state for forensics
          5. Check if confidential_strategy.pdf was successfully downloaded
          6. Review all emp_003 activity in last 90 days
          7. Alert security operations center (SOC)
          8. Notify CISO and legal team

          FORENSIC INVESTIGATION NEEDED:
          - Determine if credentials were compromised or insider threat
          - Check for lateral movement within network
          - Review network traffic from this IP
          - Assess damage and data exposure
          - Timeline reconstruction of the incident

          CONTAINMENT PRIORITY: HIGHEST

task_description: |
  Analyze employee security behavior and activity logs to identify potential insider threats,
  compromised accounts, and anomalous patterns. Provide risk assessments with specific
  security recommendations and incident response guidance.
