created_by: security_team
version: 3
task_description: |
  Analyze employee security behavior and activity logs to identify potential insider threats,
  compromised accounts, and anomalous patterns. Provide risk assessments with specific
  security recommendations and incident response guidance.
seed_examples:
  - question: |
      Analyze employee activity: emp_001 logged in from Berlin at 2:15 AM, accessed hr_layoff_plans.docx, 3 after-hours accesses recorded.
    answer: |
      Employee ID: emp_001. Risk Level: HIGH.
      After-hours access from external location and access to sensitive document suggests high risk. Recommend enhanced monitoring, verification, and further investigation.
  - question: |
      Analyze behavior: emp_002 accessed employee_salaries_2025.csv at 10:35 AM, all logins from office IP, no anomalies.
    answer: |
      Employee ID: emp_002. Risk Level: LOW.
      All activity within standard business hours, only internal network used. No immediate action required; continue standard monitoring.
  - question: |
      Assess emp_003: login at 23:45 from IP 85.232.45.100, used automated curl tool, downloaded confidential_strategy.pdf.
    answer: |
      Employee ID: emp_003. Risk Level: CRITICAL.
      After-hours, external IP, automation tool, and confidential data access indicate active security incident. Suspend account and initiate incident response.
  - question: |
      Review emp_004: 15 failed logins, multiple locations, VPN detected, repeated tries for financial docs.
    answer: |
      Employee ID: emp_004. Risk Level: HIGH.
      Multiple failed attempts and suspected VPN usage indicate possible account compromise. Enforce MFA and reset credentials.
  - question: |
      Audit emp_005: All logins during work hours, single location, resources match role, no suspicious events.
    answer: |
      Employee ID: emp_005. Risk Level: LOW.
      Behavioral baseline normal. No anomalies detected, maintain current monitoring level.
