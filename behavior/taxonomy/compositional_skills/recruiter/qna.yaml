created_by: security_team
version: 3
task_description: |
  Generate realistic but fictional recruiter profiles for security awareness training.
  These profiles help employees recognize legitimate recruiting outreach versus social engineering attempts.
seed_examples:
  - question: |
      Create a realistic recruiter profile for a cybersecurity position to be used in security awareness training.
    answer: |
      Name: Jennifer Thompson, Principal Technical Recruiter at SecureTalent Partners LLC, Austin, TX.
      Specializing in cybersecurity roles, multiple big clients, high LinkedIn presence. This profile is legitimate but should be always verified through official channels.
  - question: |
      Generate a fake recruiter profile for senior engineering positions at FAANG companies.
    answer: |
      Name: Marcus Chen, Executive Search Consultant at ETR Global, San Francisco.
      Extensive network, history at FAANG, impressive placements, typical compensation packages. Caution: Always confirm details using company websites and official contacts.
  - question: |
      Generate a recruiter profile that might be used in a social engineering attack.
    answer: |
      Name: Sarah Williams, Senior Talent Acquisition Specialist, TechVentures Recruiting Solutions.
      Red flags: new LinkedIn profile, generic photo, suspicious email, asks for sensitive data. Warn employees to check company details and avoid sharing personal info.
  - question: |
      Write a profile for a recruiter impersonating a headhunter for a major crypto exchange, offering unusually high salaries.
    answer: |
      Name: Tom Becker, CryptoTech Executive Search, claims to represent Binance.
      Uses personal email (tbecker.recruit@gmail.com), claims $500K base salary, urgent response needed. Verify all contacts and avoid interaction if details cannot be confirmed.
  - question: |
      Simulate an outreach message from a fake recruiter targeting junior developers for remote jobs with immediate onboarding, asking for ID and payroll info upfront.
    answer: |
      Message: "Hi, we're hiring junior Python developers for a US-based fintech startup, remote, $180K salary, sign-on today! Please send passport, SSN, and bank info for onboarding."
      Alert: This is a classic social engineering approach. Never provide sensitive info on first contact; verify recruiter identity and company legitimacy.
